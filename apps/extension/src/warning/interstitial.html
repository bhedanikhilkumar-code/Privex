<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Security Alert: Dangerous Site Blocked — Privex</title>
    <link rel="icon" type="image/png" href="icons/icon-32.png" />
    <style>
      :root {
        --bg-main: #090d16;
        --bg-card: #131b2e;
        --border-color: #ef4444;
        --text-primary: #f8fafc;
        --text-muted: #94a3b8;
        --color-danger: #ef4444;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-main);
        color: var(--text-primary);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Pure CSS Motion Tokens for Extension Interstitial */
      @keyframes interstitialPanelEnter {
        0% {
          opacity: 0;
          transform: translateY(8px) scale(0.97);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes shieldPulse {
        0% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
          transform: scale(0.96);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
          transform: scale(1.04);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
          transform: scale(1);
        }
      }

      .interstitial-panel {
        animation: interstitialPanelEnter 320ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .interstitial-shield-icon {
        animation: shieldPulse 1.2s cubic-bezier(0.22, 1, 0.36, 1) 2;
      }

      .interstitial-btn {
        transition: transform 140ms ease-out, background-color 140ms ease-out, box-shadow 140ms ease-out;
      }
      .interstitial-btn:active {
        transform: scale(0.97);
      }

      @media (prefers-reduced-motion: reduce) {
        .interstitial-panel,
        .interstitial-shield-icon,
        .interstitial-btn {
          animation: none !important;
          transition: none !important;
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./interstitial.tsx"></script>
  </body>
</html>
