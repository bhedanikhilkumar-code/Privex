<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SHADER_START:ANIMATION_5 class="fixed inset-0 w-full h-full" -->
<div class="fixed inset-0 w-full h-full" style="display:block;">
<canvas id="shader-canvas-ANIMATION_5" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_5');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;

// Pseudo-random generator
float hash(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}

void main() {
    vec2 st = gl_FragCoord.xy / u_resolution.xy;
    
    // Background deep cyber surface
    vec3 baseBg = vec3(0.043, 0.055, 0.071); // #0b0e12
    
    // Columns grid
    float cols = 55.0;
    vec2 grid = vec2(floor(st.x * cols), floor(st.y * 35.0));
    
    // Column speed and offset
    float colRand = hash(vec2(grid.x, 31.7));
    float speed = 0.4 + colRand * 0.6;
    
    // Falling byte packets (up to down: st.y decreases or falls)
    // Moving y downwards: add time to st.y
    float fall = fract(st.y + u_time * speed * 0.25 + colRand * 10.0);
    
    // Byte character pulse / flicker
    float cellRand = hash(vec2(grid.x, floor((st.y + u_time * speed * 0.25) * 35.0)));
    
    // Matrix tail trail calculation: sharp head, slow fade downwards
    float head = smoothstep(0.92, 0.98, fall);
    float trail = pow(fall, 3.2); // fade away trailing down
    
    // Byte glyph simulation within cell
    vec2 cellUV = fract(vec2(st.x * cols, st.y * 35.0));
    float charBox = step(0.18, cellUV.x) * step(cellUV.x, 0.82) * step(0.18, cellUV.y) * step(cellUV.y, 0.82);
    // digital bit hash mask (creates 0 / 1 / hex byte silhouettes)
    float bitMask = step(0.42, cellRand) * charBox;
    
    // Primary Cyber Colors: Neon Accent #D7FF3F and Cyber Blue #2457FF
    vec3 accentColor = vec3(0.843, 1.0, 0.247); // #D7FF3F Neon
    vec3 blueColor = vec3(0.141, 0.341, 1.0);   // #2457FF
    vec3 whiteGlow = vec3(0.95, 1.0, 0.92);
    
    // Color composition
    vec3 byteColor = mix(blueColor, accentColor, cellRand);
    vec3 glowColor = mix(byteColor, whiteGlow, head);
    
    // Falling stream intensity with subtle overall vignette & top-to-bottom slow fade
    float topFade = smoothstep(0.0, 0.2, st.y) * (1.0 - smoothstep(0.85, 1.0, st.y) * 0.3);
    float stream = (trail * 0.75 + head * 1.5) * bitMask * topFade;
    
    // Subtle background grid wireframe
    float gridLine = (step(0.96, fract(st.x * cols)) + step(0.96, fract(st.y * 35.0))) * 0.025;
    
    vec3 finalColor = baseBg + byteColor * gridLine + glowColor * stream * 0.85;
    
    // Ambient vignette
    float vig = 16.0 * st.x * st.y * (1.0 - st.x) * (1.0 - st.y);
    vig = clamp(pow(vig, 0.25), 0.0, 1.0);
    
    gl_FragColor = vec4(finalColor * vig, 1.0);
}
`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>
</div>
<!-- STITCH_SHADER_END:ANIMATION_5 -->


</body></html>
