name: Manual Deploy to Cloudflare Pages (privex.io)

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Pages (privex.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: |
          npm run build --workspace=@private-protection/core
          npm run build --workspace=@private-protection/ml

      - name: Build Web Application
        run: npm run build --workspace=@private-protection/web

      - name: Verify Web Dist Output & CNAME
        run: |
          ls -la apps/web/dist
          test -f apps/web/dist/index.html
          test -f apps/web/dist/_headers
          test -f apps/web/dist/CNAME
          cat apps/web/dist/CNAME

      - name: Deploy to Cloudflare Pages (privex.io)
        uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=privex --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment Instructions Note
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "=========================================================================="
          echo "Notice: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secrets not found."
          echo "Target Domain: https://privex.io/ (Fallback: https://privex.pages.dev/)"
          echo "If Cloudflare Pages is connected directly via Git repository integration,"
          echo "Cloudflare automatically builds and deploys from branch main."
          echo "To enable direct GitHub Actions deployment via wrangler, add these secrets"
          echo "in GitHub Repository Settings -> Secrets and variables -> Actions."
          echo "=========================================================================="
