name: CI & Release Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  deployments: write

jobs:
  # Task 1: Security & Secrets Audit
  security-audit:
    name: "1. Security & Secrets Leak Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Verify Secret Absence & Scan Codebase
        run: |
          node scripts/audit-secrets.js
          echo "Scanning code directories for high-risk pattern markers..."
          if grep -rEI "BEGIN (RSA |EC )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{30,}" packages apps tests; then
            echo "Secret leak detected!"
            exit 1
          fi
          echo "No secrets detected."

  # Task 2: Lint Analysis
  lint-codebase:
    name: "2. ESLint & Static Analysis Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core & ML Shared Packages
        run: |
          npm run build --workspace=@private-protection/core
          npm run build --workspace=@private-protection/ml

      - name: Run Workspace Linting
        run: npm run lint

  # Task 3: TypeScript Typecheck
  typecheck-validation:
    name: "3. TypeScript Strict Type Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core & ML Shared Packages
        run: |
          npm run build --workspace=@private-protection/core
          npm run build --workspace=@private-protection/ml

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

  # Task 4: Core Engine Unit & Integration Tests
  test-core-engine:
    name: "4. Core Detection Engine Tests (@private-protection/core)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core
        run: npm run build --workspace=@private-protection/core

      - name: Run Core Detection Engine Tests
        run: npm run test --workspace=@private-protection/core

  # Task 5: ML Intent Classifiers Tests
  test-ml-classifiers:
    name: "5. On-Device ML & Intent Classifier Tests (@private-protection/ml)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core & ML Dependencies
        run: |
          npm run build --workspace=@private-protection/core
          npm run build --workspace=@private-protection/ml

      - name: Run ML Intent Classifier Tests
        run: npm run test --workspace=@private-protection/ml

  # Task 6: Web Application Tests
  test-web-app:
    name: "6. Web Scanner Application & UI Tests (@private-protection/web)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core & ML Dependencies
        run: |
          npm run build --workspace=@private-protection/core
          npm run build --workspace=@private-protection/ml

      - name: Run Web Application Tests
        run: npm run test --workspace=@private-protection/web

  # Task 7: Browser Extension Tests
  test-browser-extension:
    name: "7. Browser Extension MV3 Interceptor Tests (@private-protection/extension)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core & ML Dependencies
        run: |
          npm run build --workspace=@private-protection/core
          npm run build --workspace=@private-protection/ml

      - name: Run Extension Tests
        run: npm run test --workspace=@private-protection/extension

  # Task 8: Desktop Vault & Native Tests
  test-desktop-vault:
    name: "8. Desktop Vault, Monitor & IPC Tests (@private-protection/desktop)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core, ML & Desktop Dependencies
        run: |
          npm run build --workspace=@private-protection/core
          npm run build --workspace=@private-protection/ml
          npm run build --workspace=@private-protection/desktop

      - name: Run Desktop Tests in Headless Display
        run: xvfb-run -a npm run test --workspace=@private-protection/desktop

  # Task 9: Mobile Platform Tests
  test-mobile-protection:
    name: "9. Mobile Platform & Threat Shield Tests (@private-protection/mobile)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core & ML Dependencies
        run: |
          npm run build --workspace=@private-protection/core
          npm run build --workspace=@private-protection/ml

      - name: Run Mobile Platform Tests
        run: npm run test --workspace=@private-protection/mobile

  # Task 10: Performance & Latency Benchmarks
  performance-benchmarks:
    name: "10. Real-Time Latency & Low-Resource Benchmarks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core & ML Dependencies
        run: |
          npm run build --workspace=@private-protection/core
          npm run build --workspace=@private-protection/ml

      - name: Run Desktop & Core Benchmarks
        run: xvfb-run -a npm run test:benchmarks --workspace=@private-protection/desktop

  # Task 11: Monorepo Coverage Verification Gate
  coverage-gate:
    name: "11. Monorepo Test Coverage Gate (>=90%)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core, ML, Desktop & Web
        run: |
          npm run build --workspace=@private-protection/core
          npm run build --workspace=@private-protection/ml
          npm run build --workspace=@private-protection/desktop
          npm run build --workspace=@private-protection/web

      - name: Verify Full Test Coverage
        run: xvfb-run -a npm run test:coverage

  # Task 12: Architecture & Version Consistency Audit
  architecture-integrity:
    name: "12. Architecture & Monorepo Package Consistency Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit Monorepo Package Versions
        run: node scripts/audit-versions.js

  # Task 13: Build & Release Artifacts Packaging
  build-and-package:
    name: "13. Production Build & Release Artifacts Packaging"
    runs-on: ubuntu-latest
    needs:
      - security-audit
      - lint-codebase
      - typecheck-validation
      - test-core-engine
      - test-ml-classifiers
      - test-web-app
      - test-browser-extension
      - test-desktop-vault
      - test-mobile-protection
      - performance-benchmarks
      - coverage-gate
      - architecture-integrity
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build All Workspaces
        run: npm run build

      - name: Package Production Artifacts & Checksums
        run: npm run package

      - name: Verify Artifact Checksums
        run: node scripts/verify-release-checksums.js

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/

  # Task 14: Production Deployment to privex.io
  deploy-privex-production:
    name: "14. Production Deployment to privex.io (Cloudflare Pages)"
    runs-on: ubuntu-latest
    needs: [build-and-package]
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application for Production
        run: |
          npm run build --workspace=@private-protection/core
          npm run build --workspace=@private-protection/ml
          npm run build --workspace=@private-protection/web

      - name: Verify Web Dist & Custom Domain (privex.io)
        run: |
          ls -la apps/web/dist
          test -f apps/web/dist/index.html
          test -f apps/web/dist/_headers
          test -f apps/web/dist/CNAME
          echo "Verifying CNAME points to privex.io..."
          cat apps/web/dist/CNAME

      - name: Deploy to Cloudflare Pages (privex.io)
        uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=privex --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment Fallback & Instructions
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "=========================================================================="
          echo "Notice: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret not configured."
          echo "If Cloudflare Pages is connected to this Git repository directly,"
          echo "Cloudflare automatically detects commits on 'main' and deploys to privex.io."
          echo "To enable direct deployment from GitHub Actions via Wrangler, set:"
          echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Repository Secrets."
          echo "Target Domain: https://privex.io/ (Fallback: https://privex.pages.dev/)"
          echo "=========================================================================="
