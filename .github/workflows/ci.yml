  # =========================================================================
  # GROUP 1: MONOREPO SECURITY, QUALITY & GOVERNANCE GATES
  # =========================================================================

  security-audit:
    name: "1. Security & Secrets Leak Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Dependency Vulnerability Audit
        run: npm audit --audit-level=high || true
      - name: Verify Secret Absence & Scan Codebase
        run: |
          node scripts/audit-secrets.js
          echo "Scanning code directories for high-risk pattern markers..."
          if grep -rEI "BEGIN (RSA |EC )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{30,}" packages apps tests; then
            echo "Secret leak detected!"
            exit 1
          fi
          echo "No secrets detected."

  lint-codebase:
    name: "2. ESLint & Static Analysis Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Build Core, ML & UI Shared Packages
        run: |
          npm run build --workspace=@private-protection/core
          npm run build --workspace=@private-protection/ml
          npm run build --workspace=@private-protection/ui
      - name: Run Workspace Linting
        run: npm run lint

